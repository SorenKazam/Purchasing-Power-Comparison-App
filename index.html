<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Comparação de Poder de Compra</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="container">
      <h2>Comparação de Poder de Compra</h2>
      <label>Salário mínimo no seu país:</label>
      <input type="number" id="salario1" /><br />
      <label>Preço do produto no seu país:</label>
      <input type="number" id="preco1" /><br />
      <label>Salário mínimo no outro país:</label>
      <input type="number" id="salario2" /><br />
      <label>Preço do produto no outro país:</label>
      <input type="number" id="preco2" /><br />
      <button onclick="calcular()">Calcular</button>

      <h3>Resultados:</h3>
      <p id="resultado1"></p>
      <div class="barra-container">
        <div class="barra" id="barra1"></div>
      </div>

      <p id="resultado2"></p>
      <div class="barra-container">
        <div class="barra" id="barra2"></div>
      </div>
    </div>
    <script src="./scripts.js"></script>
  </body>
</html>
